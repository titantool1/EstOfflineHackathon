spring.application.name=eco-backend
server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:55433/eco?connectTimeout=2&socketTimeout=3}
spring.datasource.username=${DATABASE_USER:eco}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jdbc.template.query-timeout=2
server.error.include-message=never
server.error.include-stacktrace=never

# Team DB uses the reconstructed schema. Legacy QA Flyway files are a separate lineage.
spring.flyway.schemas=app
spring.flyway.default-schema=app
spring.flyway.create-schemas=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.placeholder-replacement=false
spring.datasource.hikari.connection-init-sql=SET search_path TO app, public

# Reuse the existing QA's server-side session approach.
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=ECOTEAMSESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

catalog.elasticsearch.url=${CATALOG_ELASTICSEARCH_URL:http://localhost:19201}
catalog.elasticsearch.index=${CATALOG_ELASTICSEARCH_INDEX:eco-team-catalog-actions-v1-20260917}
catalog.elasticsearch.username=${CATALOG_ELASTICSEARCH_USERNAME:elastic}
catalog.elasticsearch.password=${CATALOG_ELASTICSEARCH_PASSWORD:}
