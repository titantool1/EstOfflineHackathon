services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.6-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eco}
      POSTGRES_USER: ${POSTGRES_USER:-eco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-local.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 512m
    shm_size: 128mb

  elasticsearch:
    build:
      context: ./infra/elasticsearch
      args:
        ES_VERSION: ${ES_LOCAL_VERSION:-9.5.3}
    image: eco-team-elasticsearch:${ES_LOCAL_VERSION:-9.5.3}-nori
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.autoconfiguration.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      xpack.ml.enabled: "false"
      node.store.allow_mmap: "false"
      ELASTIC_PASSWORD: ${ES_LOCAL_PASSWORD:?Run scripts/setup-local.py first}
      ES_JAVA_OPTS: ${ES_LOCAL_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "127.0.0.1:${ES_LOCAL_PORT:-19201}:9200"
    volumes:
      - dev-elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "bash", "/usr/local/bin/eco-healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    mem_limit: 1g

  backend:
    profiles: [app]
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eco}?connectTimeout=2&socketTimeout=3
      DATABASE_USER: ${POSTGRES_USER:-eco}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-local.py first}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    mem_limit: 768m

  frontend:
    profiles: [app]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_KAKAO_MAP_KEY: ${NEXT_PUBLIC_KAKAO_MAP_KEY:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./frontend/.env.local
    environment:
      SPRING_BASE_URL: http://backend:8080
      EMBEDDING_BASE_URL: http://embedding:8090
      AI_INTERNAL_TOKEN_FILE: /run/secrets/ai_internal_token
    secrets:
      - ai_internal_token
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3300}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(6000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 7s
      retries: 12
      start_period: 20s
    mem_limit: 768m

  embedding:
    profiles: [ai]
    build: ./embedding-service
    restart: unless-stopped
    environment:
      AI_INTERNAL_TOKEN_FILE: /run/secrets/ai_internal_token
    secrets:
      - ai_internal_token
    volumes:
      - bge-model-cache:/models:ro
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    mem_limit: 4g

  embedding-download:
    profiles: [setup-ai]
    build: ./embedding-service
    restart: "no"
    environment:
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    volumes:
      - bge-model-cache:/models
    command: ["python", "/app/download.py"]

  kibana_settings:
    profiles: [tools]
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_LOCAL_VERSION:-9.5.3}
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ES_LOCAL_PASSWORD:?Run scripts/setup-local.py first}
      KIBANA_PASSWORD: ${KIBANA_LOCAL_PASSWORD:?Run scripts/setup-local.py first}
    volumes:
      - ./infra/kibana/setup.sh:/setup.sh:ro
    entrypoint: ["bash", "/setup.sh"]

  kibana:
    profiles: [tools]
    image: docker.elastic.co/kibana/kibana:${ES_LOCAL_VERSION:-9.5.3}
    restart: unless-stopped
    depends_on:
      kibana_settings:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_LOCAL_PASSWORD:?Run scripts/setup-local.py first}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?Run scripts/setup-local.py first}
      NODE_OPTIONS: --max-old-space-size=768
    ports:
      - "127.0.0.1:${KIBANA_LOCAL_PORT:-15602}:5601"
    volumes:
      - dev-kibana:/usr/share/kibana/data
      - ./config/telemetry.yml:/usr/share/kibana/config/telemetry.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail --output /dev/null http://localhost:5601/login"]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 30s
    mem_limit: 1536m

volumes:
  postgres-data:
  dev-elasticsearch:
  dev-kibana:

  bge-model-cache:

secrets:
  ai_internal_token:
    file: ./.local/ai-internal-token
